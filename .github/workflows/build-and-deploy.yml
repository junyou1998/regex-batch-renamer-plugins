name: Build and Deploy Marketplace

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate plugins
        run: npm run validate

      - name: Build plugins & marketplace index
        run: npm run build

      - name: Commit & Push dist assets
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: 🎡 — auto build marketplace index and plugin bundles" && git push)
